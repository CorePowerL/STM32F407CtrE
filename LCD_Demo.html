<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT LCD 800x480 演示</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='10' fill='%230a0e14'/><rect x='10' y='20' width='80' height='50' rx='3' fill='none' stroke='%2300ff88' stroke-width='3'/><circle cx='25' cy='85' r='5' fill='%2300ff88'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Consolas", "Courier New", monospace;
  }
  /* 屏幕外框 */
  .lcd-frame {
    width: 840px;
    height: 520px;
    background: #2a2a2a;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  /* 实际显示区域 800x480 */
  .lcd-screen {
    width: 800px;
    height: 480px;
    background: #0a0e14;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    color: #00ff88;
  }
  /* 顶部状态栏 */
  .top-bar {
    height: 36px;
    background: #1a2332;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid #2a3a5a;
    font-size: 14px;
  }
  .top-bar .title { color: #00ccff; font-weight: bold; }
  .top-bar .clock { color: #00ff88; }
  /* 主体区域 */
  .main-area {
    display: flex;
    height: calc(480px - 36px - 40px);
  }
  /* 左侧大数字区 */
  .left-panel {
    width: 220px;
    padding: 12px;
    border-right: 1px solid #2a3a5a;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .gauge {
    background: #0d1520;
    border: 1px solid #2a3a5a;
    border-radius: 4px;
    padding: 10px;
    text-align: center;
  }
  .gauge-label {
    font-size: 12px;
    color: #6688aa;
    margin-bottom: 4px;
  }
  .gauge-value {
    font-size: 32px;
    font-weight: bold;
    color: #00ff88;
  }
  .gauge-unit {
    font-size: 12px;
    color: #6688aa;
  }
  .gauge.yellow .gauge-value { color: #ffee00; }
  .gauge.red .gauge-value { color: #ff4444; }
  /* 中间波形区 */
  .center-panel {
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .wave-title {
    font-size: 12px;
    color: #6688aa;
    margin-bottom: 6px;
  }
  #waveform {
    flex: 1;
    background: #0d1520;
    border: 1px solid #2a3a5a;
    border-radius: 4px;
  }
  /* 右侧状态区 */
  .right-panel {
    width: 180px;
    padding: 12px;
    border-left: 1px solid #2a3a5a;
  }
  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 6px #00ff88;
  }
  .led.off { background: #333; box-shadow: none; }
  .led.yellow { background: #ffee00; box-shadow: 0 0 6px #ffee00; }
  /* 底部按钮栏 */
  .bottom-bar {
    height: 40px;
    background: #1a2332;
    border-top: 1px solid #2a3a5a;
    display: flex;
  }
  .btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #00ccff;
    border-right: 1px solid #2a3a5a;
    cursor: pointer;
  }
  .btn:last-child { border-right: none; }
  .btn:active { background: #2a4a6a; }
</style>
</head>
<body>

<div class="lcd-frame">
  <div class="lcd-screen">
    <!-- 顶部状态栏 -->
    <div class="top-bar">
      <span class="title">Motor-1 HMI v1.0</span>
      <span class="clock" id="clock">00:00:00</span>
    </div>

    <!-- 主体 -->
    <div class="main-area">
      <!-- 左侧仪表盘 -->
      <div class="left-panel">
        <div class="gauge">
          <div class="gauge-label">电压 (VBAT)</div>
          <div class="gauge-value" id="voltage">12.0</div>
          <div class="gauge-unit">V</div>
        </div>
        <div class="gauge yellow">
          <div class="gauge-label">温度 (MCU)</div>
          <div class="gauge-value" id="temp">45.2</div>
          <div class="gauge-unit">°C</div>
        </div>
        <div class="gauge red">
          <div class="gauge-label">转速 (RPM)</div>
          <div class="gauge-value" id="rpm">0</div>
          <div class="gauge-unit">rpm</div>
        </div>
      </div>

      <!-- 中间波形 -->
      <div class="center-panel">
        <div class="wave-title">ADC 通道 0 - 实时波形</div>
        <canvas id="waveform" width="360" height="280"></canvas>
      </div>

      <!-- 右侧状态 -->
      <div class="right-panel">
        <div class="status-item"><div class="led" id="led-run"></div>运行状态</div>
        <div class="status-item"><div class="led" id="led-pwm"></div>PWM 输出</div>
        <div class="status-item"><div class="led yellow" id="led-warn"></div>警告</div>
        <div class="status-item"><div class="led off" id="led-err"></div>故障</div>
        <div style="margin-top:16px; font-size:11px; color:#6688aa; line-height:1.6;">
          采样率: 1kHz<br>
          分辨率: 12bit<br>
          接口: FSMC<br>
          驱动: SSD1963
        </div>
      </div>
    </div>

    <!-- 底部按钮 -->
    <div class="bottom-bar">
      <div class="btn" onclick="btnClick(this)">启动</div>
      <div class="btn" onclick="btnClick(this)">停止</div>
      <div class="btn" onclick="btnClick(this)">参数</div>
      <div class="btn" onclick="btnClick(this)">设置</div>
    </div>
  </div>
</div>

<script>
// 时钟
function updateClock() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

// 模拟数据波动
setInterval(() => {
  document.getElementById('voltage').textContent = (11.8 + Math.random() * 0.4).toFixed(1);
  document.getElementById('temp').textContent = (44 + Math.random() * 3).toFixed(1);
  document.getElementById('rpm').textContent = Math.floor(1200 + Math.random() * 200);
}, 500);

// 波形绘制
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
let data = new Array(W).fill(H / 2);

function drawWave() {
  // 滚动数据
  data.shift();
  // 模拟带噪声的正弦波
  const t = Date.now() / 200;
  const v = H/2 + Math.sin(t) * 60 + Math.sin(t*2.3) * 20 + (Math.random()-0.5) * 8;
  data.push(v);

  ctx.fillStyle = '#0d1520';
  ctx.fillRect(0, 0, W, H);

  // 网格
  ctx.strokeStyle = '#1a2a3a';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 波形
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < W; i++) {
    if (i === 0) ctx.moveTo(i, data[i]);
    else ctx.lineTo(i, data[i]);
  }
  ctx.stroke();

  requestAnimationFrame(drawWave);
}
drawWave();

// 按钮点击反馈
function btnClick(btn) {
  const orig = btn.style.background;
  btn.style.background = '#2a4a6a';
  setTimeout(() => btn.style.background = orig, 150);
}
</script>

</body>
</html>
